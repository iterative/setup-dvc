name: Check DVC GitHub Action
on:
  schedule:
    - cron: '0 0 * * *' # everyday @ 0000 UTC
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm ci
          npm run build
          git diff --exit-code
  check:
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        installer: [pip]
        system:
          - ubuntu-latest
          - macos-latest
          - windows-latest
          - macos-13
        version:
          - '1.0.1'
          - '2.18.1'
          - '3.61.0'
        include:
        - system: ubuntu-22.04-arm
          version: '3.61.0'
          installer: uv
        - system: ubuntu-22.04-arm
          version: '3.61.0'
          installer: pip
        - system: windows-latest
          version: '3.61.0'
          installer: uv
    runs-on: ${{ matrix.system }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: ${{ matrix.system == 'windows' || contains(matrix.system, 'arm') }}
        with:
          python-version: '3.x'
      - uses: astral-sh/setup-uv@v6
        if: matrix.installer == 'uv'
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - name: local action with ${{ matrix.version }}
        uses: ./
        with:
          version: ${{ matrix.version }}
      - run: dvc version || true
      - name: test DVC specific version
        run: |
          test "$(dvc --version)" == "${{ matrix.version}}"
      - name: local action with defaults
        uses: ./
      - run: dvc version || true
      - name: test DVC latest version
        run: |
          test "$(dvc --version)" != "${{ matrix.version}}"
